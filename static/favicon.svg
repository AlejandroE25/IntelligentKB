<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>iKB Search</title>
  <!-- dark navy background -->
  <rect width="32" height="32" rx="6" fill="#1a2030"/>
  <!-- Block I (UIUC Illini Orange) — the "i" -->
  <rect x="3" y="4" width="8.5" height="3.5" rx="0.5" fill="#FF5F05"/>
  <rect x="5.75" y="7.5" width="3" height="17" fill="#FF5F05"/>
  <rect x="3" y="24.5" width="8.5" height="3.5" rx="0.5" fill="#FF5F05"/>
  <!-- K -->
  <rect x="13" y="4" width="2.5" height="24" rx="1" fill="#dce8f8"/>
  <line x1="15.5" y1="15" x2="21" y2="4" stroke="#dce8f8" stroke-width="3" stroke-linecap="round"/>
  <line x1="15.5" y1="17" x2="21" y2="28" stroke="#dce8f8" stroke-width="3" stroke-linecap="round"/>
  <!-- B: upper loop (r=5, center at x=30.5) then lower loop (r=6.5, center at x=32) -->
  <path d="M 22.5,4 L 25.5,4 A 5,5 0 0 1 25.5,14 L 22.5,14 L 22.5,15 L 25.5,15 A 6.5,6.5 0 0 1 25.5,28 L 22.5,28 Z" fill="#dce8f8"/>
</svg>
