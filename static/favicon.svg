<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>iKB Search</title>
  <!-- Illini Blue background (official UIUC #13294B) -->
  <rect width="32" height="32" rx="4" fill="#13294B"/>
  <!-- Block I (Illini Orange #FF5F05) — left column, x=2–14, y=4–28 -->
  <rect x="2" y="4" width="12" height="3" rx="0.5" fill="#FF5F05"/>
  <rect x="5.5" y="7" width="5" height="18" fill="#FF5F05"/>
  <rect x="2" y="25" width="12" height="3" rx="0.5" fill="#FF5F05"/>
  <!-- K — upper right, y=4–15, arms to x=28 -->
  <rect x="16.5" y="4" width="2.5" height="11" rx="0.8" fill="#dce8f8"/>
  <line x1="19" y1="9.5" x2="28" y2="4"  stroke="#dce8f8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="9.5" x2="28" y2="15" stroke="#dce8f8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- B — lower right, y=18–30, upper loop r=2.5 lower loop r=3 -->
  <path d="M 16.5,18 L 20,18 A 2.5,2.5 0 0 1 20,23 L 16.5,23 L 16.5,24 L 20,24 A 3,3 0 0 1 20,30 L 16.5,30 Z" fill="#dce8f8"/>
</svg>
